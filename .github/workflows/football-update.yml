# Futbol sitesinin (jinjagames.com/football/) verisini her gece Türkiye saatiyle 00.00'da günceller: maç sonuçları, günün haberleri, kadrolar,
# sakatlıklar, transferler, teknik direktör/başkan/sahip değişiklikleri. Son güncellemeden bu yana ne değiştiyse onu alır; eski sezonlara
# ham veri değişmedikçe dokunmaz. CurseForge iş akışından (curseforge-stats.yml) bağımsızdır: ayrı grup, ayrı dosyalar.
# 21:05 UTC = 00.05 TSİ (CurseForge iş akışı :00'da çalıştığı için çakışmasın diye birkaç dakika sonra). GitHub zamanlanmış işleri
# yoğunlukta birkaç dakika geciktirebilir. Elle çalıştırmak: Actions > "Football güncelle" > Run workflow.
name: Football güncelle

on:
  schedule:
    - cron: "5 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: football-update
  cancel-in-progress: false

env:
  WIF_BUILT: football/data              # derlenmiş veri doğrudan sitenin klasörüne yazılır
  WIF_LAST: tools/football/last         # güncellemeler arası durum depoda tutulur (önbellek silinse de kaybolmaz)
  WIF_RAW: ${{ github.workspace }}/.football-raw   # indirilen ham veri (depoya girmez)
  PYTHONIOENCODING: utf-8

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/football/requirements.txt

      - run: pip install -r tools/football/requirements.txt

      # Ham veri (değişmeyen Transfermarkt dosyaları) önbelleğe alınır; silinirse yeniden indirilir.
      - name: Ham veri önbelleği
        uses: actions/cache@v4
        with:
          path: .football-raw
          key: football-raw-v1-${{ github.run_id }}
          restore-keys: football-raw-v1-

      - name: Güncelle (artımlı)
        run: python tools/football/pipeline/update.py

      - name: Değiştiyse siteye işle
        run: |
          git config user.name "jinjagames-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football tools/football/last
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Football: günlük güncelleme $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi
