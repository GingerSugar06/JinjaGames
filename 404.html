<!doctype html>

<style>
:root{--bg:#f3f8f9;--surface:#fff;--ink:#10222d;--muted:#5b707b;--line:#cee0e5;--brand:#ce2b2b;--brand2:#e85c4e;--cy:#38c7b4}html[data-theme="dark"]{--bg:#0f0c0d;--surface:#191415;--ink:#f7f1f0;--muted:#c2b2b1;--line:#2b2223}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:radial-gradient(circle at 10% 90%,rgba(56,199,180,.16),transparent 35%),radial-gradient(circle at 90% 8%,rgba(206,43,43,.18),transparent 38%),var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);padding:clamp(36px,7vw,72px);border:1px solid var(--line);border-radius:30px;background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:0 28px 70px rgba(13,42,52,.14);text-align:center}.mark{width:62px;height:62px;margin:0 auto 26px;border-radius:20px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-size:24px;font-weight:900;box-shadow:0 12px 28px rgba(206,43,43,.25)}.code{margin:0;color:var(--cy);font-size:13px;font-weight:900;letter-spacing:.16em}.en,.tr{display:block}html[data-lang="en"] .tr,html[data-lang="tr"] .en{display:none!important}h1{font-size:clamp(38px,7vw,62px);line-height:1.02;letter-spacing:-.055em;margin:12px 0}p{max-width:430px;margin:0 auto 30px;color:var(--muted)}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}a{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border:1px solid var(--line);border-radius:13px;color:var(--ink);font-weight:800;text-decoration:none}.primary{border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 12px 28px rgba(206,43,43,.24)}a:hover{transform:translateY(-2px)}
</style>
<script>(function(){try{var d=document.documentElement,t=localStorage.getItem('jg_theme'),l=localStorage.getItem('jg_lang');d.setAttribute('data-theme',t==='dark'?'dark':'light');d.setAttribute('data-lang',l==='tr'?'tr':'en');d.lang=l==='tr'?'tr':'en'}catch(e){}})()</script>
